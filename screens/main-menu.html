<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archaeology Picross - Main Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Classic 4-tone Game Boy Palette:
       #0f380f (deepest green-black)
       #306230 (dark shadow green)
       #8bac0f (medium LCD green)
       #9bbc0f (bright LCD highlight green)
    */
    :root {
      --gb-black: #081808;
      --gb-darkest: #0f380f;
      --gb-dark: #235223;
      --gb-mid: #688c0a;
      --gb-light: #8bac0f;
      --gb-bright: #9bbc0f;
      --gb-glow: #b2d41a;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background-color: var(--gb-black);
      color: var(--gb-darkest);
      image-rendering: pixelated;
      user-select: none;
      -webkit-font-smoothing: none;
    }

    /* Pixel scanline overlay */
    .lcd-screen {
      background-color: var(--gb-light);
      position: relative;
      box-shadow: inset 0 0 16px rgba(15, 56, 15, 0.45);
    }

    .lcd-screen::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(139, 172, 15, 0) 50%, rgba(15, 56, 15, 0.12) 50%);
      background-size: 100% 4px;
      z-index: 15;
      pointer-events: none;
      opacity: 0.65;
    }

    /* Dot matrix texture subtle screen effect */
    .lcd-matrix {
      background-image: 
        radial-gradient(var(--gb-dark) 12%, transparent 13%),
        radial-gradient(var(--gb-dark) 12%, transparent 13%);
      background-size: 4px 4px;
      background-position: 0 0, 2px 2px;
      opacity: 0.15;
    }

    /* Beveled pixel stone borders */
    .stone-bezel-outer {
      border: 4px solid var(--gb-darkest);
      box-shadow: 
        inset 4px 4px 0 var(--gb-bright),
        inset -4px -4px 0 var(--gb-dark),
        0 6px 0 var(--gb-darkest);
    }

    .stone-plate {
      background-color: var(--gb-light);
      border: 4px solid var(--gb-darkest);
      box-shadow: 
        inset 4px 4px 0 var(--gb-bright),
        inset -4px -4px 0 var(--gb-dark);
    }

    .stone-tablet-btn {
      background-color: var(--gb-light);
      border: 4px solid var(--gb-darkest);
      box-shadow: 
        inset 3px 3px 0 var(--gb-bright),
        inset -3px -3px 0 var(--gb-dark),
        0 6px 0 var(--gb-darkest);
      transition: all 0.1s steps(2);
      cursor: pointer;
    }

    .stone-tablet-btn:hover, .stone-tablet-btn.active-tab {
      background-color: var(--gb-bright);
      box-shadow: 
        inset 3px 3px 0 var(--gb-glow),
        inset -3px -3px 0 var(--gb-darkest),
        0 6px 0 var(--gb-darkest);
    }

    .stone-tablet-btn:active {
      transform: translateY(4px);
      box-shadow: 
        inset 3px 3px 0 var(--gb-dark),
        inset -3px -3px 0 var(--gb-bright),
        0 2px 0 var(--gb-darkest);
    }

    /* Temple Pillar Brick Textures */
    .pillar-brick {
      background-color: var(--gb-light);
      border-right: 4px solid var(--gb-darkest);
      border-left: 4px solid var(--gb-darkest);
      position: relative;
    }

    .brick-row {
      border-bottom: 3px solid var(--gb-darkest);
      position: relative;
    }

    /* Brick highlights */
    .brick-row::before {
      content: "";
      position: absolute;
      top: 1px;
      left: 1px;
      right: 1px;
      height: 2px;
      background: var(--gb-bright);
      pointer-events: none;
    }

    /* Brick shadow crack */
    .brick-crack {
      position: absolute;
      background-color: var(--gb-darkest);
    }

    /* Blinking cursor animation */
    @keyframes chisel-pulse {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-4px); }
    }

    .cursor-chisel-anim {
      animation: chisel-pulse 0.8s steps(2) infinite;
    }

    /* Ancient glyph pattern background in center hall */
    .hieroglyph-bg {
      background-color: #82a30d;
      background-image: 
        linear-gradient(45deg, var(--gb-darkest) 25%, transparent 25%), 
        linear-gradient(-45deg, var(--gb-darkest) 25%, transparent 25%), 
        linear-gradient(135deg, var(--gb-darkest) 25%, transparent 25%), 
        linear-gradient(-135deg, var(--gb-darkest) 25%, transparent 25%);
      background-size: 16px 16px;
      background-position: 8px 0, 8px 0, 0 0, 0 0;
      opacity: 0.12;
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-2 sm:p-4">

  <!-- Mobile Portrait Shell (390px x 844px typical retro handheld aspect) -->
  <main class="w-full max-w-[400px] h-[844px] bg-[#0c240c] rounded-2xl p-3 border-4 border-[#061206] shadow-2xl flex flex-col justify-between relative overflow-hidden select-none">
    
    <!-- Top System Trim: Retro Dot Matrix Display Bezel -->
    <header class="flex items-center justify-between px-3 py-1 mb-1 text-[8px] text-[#557708] border-b-2 border-[#163b16] pb-1">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#cc2222] shadow-[0_0_5px_#f53333] border border-[#300000]"></span>
        <span class="tracking-widest uppercase font-bold text-[#6d9609]">BATTERY</span>
      </div>
      <div class="tracking-wider uppercase font-bold text-[#6d9609] text-[7px]">
        DOT MATRIX WITH STEREO SOUND
      </div>
    </header>

    <!-- Main Game Boy LCD Screen Area -->
    <div class="lcd-screen flex-1 rounded-lg border-4 border-[#081808] flex flex-col justify-between relative overflow-hidden p-2.5">
      
      <!-- Screen Matrix Grid Pattern (Background Depth) -->
      <div class="absolute inset-0 hieroglyph-bg pointer-events-none z-0"></div>
      <div class="absolute inset-0 lcd-matrix pointer-events-none z-0"></div>

      <!-- Ancient Temple Left Pillar Column -->
      <aside aria-label="Left Temple Pillar" class="absolute left-0 top-0 bottom-0 w-8 sm:w-9 z-10 flex flex-col border-r-4 border-[var(--gb-darkest)] bg-[var(--gb-light)] shadow-[2px_0_0_var(--gb-dark)]">
        <!-- Capital Header -->
        <div class="h-8 border-b-4 border-[var(--gb-darkest)] bg-[var(--gb-bright)] flex items-center justify-center p-1">
          <div class="w-full h-full border-2 border-[var(--gb-darkest)] bg-[var(--gb-light)] flex flex-col justify-between p-[2px]">
            <div class="w-full h-[2px] bg-[var(--gb-bright)]"></div>
            <div class="w-full h-[2px] bg-[var(--gb-dark)]"></div>
          </div>
        </div>
        <!-- Pillar Segment Rows -->
        <div class="flex-1 flex flex-col justify-between py-1">
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[7px] text-[var(--gb-dark)]">▲</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center">
            <div class="w-3 h-3 border-2 border-[var(--gb-darkest)] bg-[var(--gb-dark)]"></div>
          </div>
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[7px] text-[var(--gb-dark)] font-bold">Ξ</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center relative">
            <div class="w-4 h-1 bg-[var(--gb-darkest)]"></div>
            <div class="brick-crack w-[2px] h-3 top-2 left-2 rotate-45"></div>
          </div>
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[6px] text-[var(--gb-dark)]">◈</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center">
            <div class="w-3 h-3 border-2 border-[var(--gb-darkest)] rotate-45 bg-[var(--gb-light)]"></div>
          </div>
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[7px] text-[var(--gb-dark)] font-bold">▲</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center relative">
            <div class="w-2 h-2 rounded-none bg-[var(--gb-darkest)]"></div>
            <div class="brick-crack w-3 h-[2px] bottom-1 right-1"></div>
          </div>
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[7px] text-[var(--gb-dark)]">Ξ</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center">
            <div class="w-3 h-3 border-2 border-[var(--gb-darkest)] bg-[var(--gb-dark)]"></div>
          </div>
        </div>
        <!-- Pillar Base -->
        <div class="h-8 border-t-4 border-[var(--gb-darkest)] bg-[var(--gb-bright)] flex items-center justify-center p-1">
          <div class="w-full h-full border-2 border-[var(--gb-darkest)] bg-[var(--gb-dark)] flex items-center justify-center">
            <div class="w-3 h-[2px] bg-[var(--gb-bright)]"></div>
          </div>
        </div>
      </aside>

      <!-- Ancient Temple Right Pillar Column -->
      <aside aria-label="Right Temple Pillar" class="absolute right-0 top-0 bottom-0 w-8 sm:w-9 z-10 flex flex-col border-l-4 border-[var(--gb-darkest)] bg-[var(--gb-light)] shadow-[-2px_0_0_var(--gb-dark)]">
        <!-- Capital Header -->
        <div class="h-8 border-b-4 border-[var(--gb-darkest)] bg-[var(--gb-bright)] flex items-center justify-center p-1">
          <div class="w-full h-full border-2 border-[var(--gb-darkest)] bg-[var(--gb-light)] flex flex-col justify-between p-[2px]">
            <div class="w-full h-[2px] bg-[var(--gb-bright)]"></div>
            <div class="w-full h-[2px] bg-[var(--gb-dark)]"></div>
          </div>
        </div>
        <!-- Pillar Segment Rows -->
        <div class="flex-1 flex flex-col justify-between py-1">
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[7px] text-[var(--gb-dark)]">▲</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center">
            <div class="w-3 h-3 border-2 border-[var(--gb-darkest)] bg-[var(--gb-dark)]"></div>
          </div>
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[7px] text-[var(--gb-dark)] font-bold">Ξ</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center relative">
            <div class="brick-crack w-[2px] h-3 top-2 right-2 -rotate-45"></div>
            <div class="w-4 h-1 bg-[var(--gb-darkest)]"></div>
          </div>
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[6px] text-[var(--gb-dark)]">◈</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center">
            <div class="w-3 h-3 border-2 border-[var(--gb-darkest)] rotate-45 bg-[var(--gb-light)]"></div>
          </div>
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[7px] text-[var(--gb-dark)] font-bold">▲</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center relative">
            <div class="w-2 h-2 rounded-none bg-[var(--gb-darkest)]"></div>
            <div class="brick-crack w-3 h-[2px] top-1 left-1"></div>
          </div>
          <div class="brick-row h-7 flex items-center justify-center">
            <span class="text-[7px] text-[var(--gb-dark)]">Ξ</span>
          </div>
          <div class="brick-row h-8 flex items-center justify-center">
            <div class="w-3 h-3 border-2 border-[var(--gb-darkest)] bg-[var(--gb-dark)]"></div>
          </div>
        </div>
        <!-- Pillar Base -->
        <div class="h-8 border-t-4 border-[var(--gb-darkest)] bg-[var(--gb-bright)] flex items-center justify-center p-1">
          <div class="w-full h-full border-2 border-[var(--gb-darkest)] bg-[var(--gb-dark)] flex items-center justify-center">
            <div class="w-3 h-[2px] bg-[var(--gb-bright)]"></div>
          </div>
        </div>
      </aside>

      <!-- Center Inner Sanctum (Between Left and Right Pillars) -->
      <div class="relative z-20 mx-8 sm:mx-9 flex flex-col justify-between h-full pt-1 pb-1">
        
        <!-- TOP SECTION: Carved Ancient Stone Title Header Banner -->
        <section aria-label="Game Title Banner" class="flex flex-col items-center">
          
          <!-- Outer Arch Pediment Decor -->
          <div class="w-full flex items-center justify-center mb-1">
            <div class="h-2 w-8 border-b-2 border-r-2 border-[var(--gb-darkest)] bg-[var(--gb-mid)]"></div>
            <div class="px-2 py-[2px] bg-[var(--gb-darkest)] text-[var(--gb-bright)] text-[7px] tracking-widest uppercase border-2 border-[var(--gb-mid)]">
              ★ 1995 NINTEX ★
            </div>
            <div class="h-2 w-8 border-b-2 border-l-2 border-[var(--gb-darkest)] bg-[var(--gb-mid)]"></div>
          </div>

          <!-- Heavy Carved Stone Tablet Banner -->
          <div class="w-full stone-bezel-outer bg-[var(--gb-light)] p-2.5 text-center relative">
            <!-- Corner Rivets / Stone Pegs -->
            <span class="absolute top-1 left-1 w-1.5 h-1.5 bg-[var(--gb-darkest)] shadow-[1px_1px_0_var(--gb-bright)]"></span>
            <span class="absolute top-1 right-1 w-1.5 h-1.5 bg-[var(--gb-darkest)] shadow-[1px_1px_0_var(--gb-bright)]"></span>
            <span class="absolute bottom-1 left-1 w-1.5 h-1.5 bg-[var(--gb-darkest)] shadow-[1px_1px_0_var(--gb-bright)]"></span>
            <span class="absolute bottom-1 right-1 w-1.5 h-1.5 bg-[var(--gb-darkest)] shadow-[1px_1px_0_var(--gb-bright)]"></span>

            <!-- Subtitle Eyebrow -->
            <div class="text-[7px] text-[var(--gb-dark)] font-bold tracking-[0.25em] uppercase mb-1">
              - ANCIENT RELIC DIG -
            </div>

            <!-- Main Title in bold retro pixel typography with relief shadow -->
            <div class="relative inline-block my-1">
              <!-- Shadow text for carved stone 3D depth -->
              <h1 class="text-[17px] sm:text-[19px] leading-tight text-[var(--gb-darkest)] tracking-tight font-black uppercase drop-shadow-[2px_2px_0_var(--gb-bright)]">
                ARCHAEO<br/>
                <span class="text-[18px] sm:text-[20px] text-[var(--gb-darkest)] tracking-normal border-b-4 border-[var(--gb-darkest)] pb-0.5 inline-block">
                  PICROSS
                </span>
              </h1>
            </div>

            <!-- Archaeological Ornament: Pixel Pith Helmet & Chisel Motif -->
            <div class="mt-2 pt-1 border-t-2 border-[var(--gb-dark)] flex items-center justify-center gap-3 text-[8px] text-[var(--gb-darkest)]">
              <span>◄ ◈ ►</span>
              <span class="text-[7px] font-bold tracking-wider">EXPEDITION</span>
              <span>◄ ◈ ►</span>
            </div>
          </div>
        </section>

        <!-- MID SECTION: Interactive Center Menu Tablet Buttons -->
        <section aria-label="Main Menu Options" class="my-auto py-2 flex flex-col items-center w-full px-1">
          
          <div class="w-full flex flex-col gap-4 relative">

            <!-- BUTTON 1: HOW TO PLAY -->
            <div class="relative w-full flex items-center">
              <!-- Empty spacer to mirror cursor width and keep buttons aligned -->
              <div class="w-7 sm:w-8 flex-shrink-0 flex items-center justify-center">
                <!-- Inactive cursor spot -->
              </div>
              <button type="button" class="stone-tablet-btn flex-1 py-3 px-2 text-center text-[10px] sm:text-[11px] font-bold text-[var(--gb-darkest)] tracking-wider uppercase">
                HOW TO PLAY
              </button>
            </div>

            <!-- BUTTON 2: EASY PICROSS -->
            <div class="relative w-full flex items-center">
              <div class="w-7 sm:w-8 flex-shrink-0 flex items-center justify-center">
                <!-- Inactive cursor spot -->
              </div>
              <button type="button" class="stone-tablet-btn flex-1 py-3 px-2 text-center text-[10px] sm:text-[11px] font-bold text-[var(--gb-darkest)] tracking-wider uppercase">
                EASY PICROSS
              </button>
            </div>

            <!-- BUTTON 3: PICROSS (HIGHLIGHTED WITH PIXEL CHISEL CURSOR) -->
            <div class="relative w-full flex items-center">
              
              <!-- Active Pixel Chisel Cursor on Left Edge -->
              <div class="w-7 sm:w-8 flex-shrink-0 flex items-center justify-center pr-1">
                <!-- Handcrafted Pixel Chisel Cursor -->
                <svg class="cursor-chisel-anim w-6 h-6 drop-shadow-[1px_1px_0_var(--gb-darkest)]" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <!-- Chisel metal blade tip pointing right toward PICROSS button -->
                  <polygon points="12,8 9,5 9,11" fill="var(--gb-darkest)" />
                  <rect x="7" y="6" width="3" height="4" fill="var(--gb-darkest)" />
                  <rect x="8" y="7" width="2" height="2" fill="var(--gb-bright)" />
                  <!-- Chisel bolster collar -->
                  <rect x="5" y="5" width="2" height="6" fill="var(--gb-dark)" />
                  <!-- Wooden handle -->
                  <rect x="1" y="6" width="4" height="4" fill="var(--gb-darkest)" />
                  <rect x="2" y="7" width="2" height="2" fill="var(--gb-light)" />
                  <!-- Butt cap -->
                  <rect x="0" y="6" width="1" height="4" fill="var(--gb-dark)" />
                </svg>
              </div>

              <!-- Highlighted Stone Tablet Button -->
              <button type="button" class="stone-tablet-btn active-tab flex-1 py-3 px-2 text-center text-[10px] sm:text-[11px] font-bold text-[var(--gb-darkest)] tracking-wider uppercase border-[var(--gb-darkest)] relative">
                <!-- Subtle carved corner brackets indicating selection -->
                <span class="absolute left-1.5 top-1.5 text-[8px] text-[var(--gb-dark)]">◤</span>
                <span class="absolute right-1.5 top-1.5 text-[8px] text-[var(--gb-dark)]">◥</span>
                <span class="absolute left-1.5 bottom-1.5 text-[8px] text-[var(--gb-dark)]">◣</span>
                <span class="absolute right-1.5 bottom-1.5 text-[8px] text-[var(--gb-dark)]">◢</span>
                
                <span class="inline-block border-b-2 border-[var(--gb-darkest)] pb-[1px]">
                  PICROSS
                </span>
              </button>
            </div>

          </div>

          <!-- Pixel Explorer Mascot Silhouette Alcove (Theme Continuity) -->
          <div class="mt-4 px-3 py-1.5 bg-[var(--gb-darkest)] border-2 border-[var(--gb-mid)] text-[var(--gb-bright)] flex items-center justify-between w-full max-w-[240px] text-[7px] tracking-widest">
            <!-- Pith Helmet Pixel Sprite Icon -->
            <div class="flex items-center gap-1.5">
              <div class="w-3.5 h-3.5 bg-[var(--gb-light)] flex flex-col justify-center items-center p-[1px]">
                <div class="w-2.5 h-[2px] bg-[var(--gb-darkest)]"></div>
                <div class="w-1.5 h-1.5 bg-[var(--gb-darkest)]"></div>
              </div>
              <span>LEVEL 1-A READY</span>
            </div>
            <span class="animate-pulse">●</span>
          </div>

        </section>

        <!-- BOTTOM SECTION: Embedded Stone Floor Border & Controller Navigation Prompt -->
        <footer aria-label="Menu Navigation Footer" class="w-full flex flex-col items-center">
          
          <!-- Stepped Ancient Altar Stone Slab -->
          <div class="w-full bg-[var(--gb-mid)] border-t-2 border-[var(--gb-dark)] h-2 mb-[1px]"></div>
          
          <!-- Embedded Stone Floor Footer Banner -->
          <div class="w-full bg-[var(--gb-light)] border-4 border-[var(--gb-darkest)] p-2 shadow-[inset_0_2px_0_var(--gb-bright)] flex items-center justify-between">
            
            <!-- Left Action: A Button Enter -->
            <div class="flex items-center gap-1 text-[7px] sm:text-[8px] font-bold text-[var(--gb-darkest)]">
              <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-[var(--gb-darkest)] text-[var(--gb-bright)] text-[7px] border border-[var(--gb-light)]">
                A
              </span>
              <span class="tracking-wider">SELECT</span>
            </div>

            <!-- Center Decorative Glyph Divider -->
            <span class="text-[7px] text-[var(--gb-dark)]">❖</span>

            <!-- Required User Text Prompt: B + CANCEL -->
            <div class="flex items-center gap-1 text-[7px] sm:text-[8px] font-bold text-[var(--gb-darkest)]">
              <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-[var(--gb-darkest)] text-[var(--gb-bright)] text-[7px] border border-[var(--gb-light)]">
                B
              </span>
              <span class="tracking-wider">+ CANCEL</span>
            </div>

          </div>

          <!-- Bottom Stone Floor Edge Trim with Masonry Seams -->
          <div class="w-full grid grid-cols-4 gap-1 mt-1 px-1">
            <div class="h-1.5 bg-[var(--gb-darkest)]"></div>
            <div class="h-1.5 bg-[var(--gb-dark)]"></div>
            <div class="h-1.5 bg-[var(--gb-darkest)]"></div>
            <div class="h-1.5 bg-[var(--gb-dark)]"></div>
          </div>

        </footer>

      </div>

    </div>

    <!-- Handheld Bottom Housing Detail -->
    <div class="flex items-center justify-between px-4 pt-2 text-[7px] text-[#4d7008]">
      <div class="flex items-center gap-1">
        <span>◀</span>
        <span class="tracking-widest font-bold">GAME BOY COLOR COMPATIBLE</span>
      </div>
      <div class="font-bold tracking-widest">DMG-AP-USA</div>
    </div>

  </main>

</body>
</html>
