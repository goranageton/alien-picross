<!-- BEGIN: Custom Game Boy Theme Styles -->
<style data-purpose="theme-palette">
    :root {
      --gb-lightest: #9bbc0f;
      --gb-light: #8bac0f;
      --gb-dark: #306230;
      --gb-darkest: #0f380f;
      --stone-body: #7c9b2d;
      --stone-shadow: #21421e;
      --stone-highlight: #b0cd3b;
    }

    body {
      background-color: #0b1e0b;
      font-family: 'Press Start 2P', monospace;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
  </style>
<style data-purpose="pixel-textures">
    /* Pixelated screen look */
    .pixel-lcd {
      background-color: var(--gb-lightest);
      image-rendering: pixelated;
      box-shadow: inset 0 0 10px rgba(15, 56, 15, 0.45);
    }

    /* Carved stone borders & cracks */
    .stone-frame {
      background-color: var(--gb-light);
      border-color: var(--gb-darkest);
      box-shadow: 
        inset 3px 3px 0px 0px var(--gb-lightest),
        inset -3px -3px 0px 0px var(--gb-dark),
        0 4px 0px 0px var(--gb-darkest);
    }

    .stone-inset {
      background-color: var(--gb-dark);
      box-shadow: 
        inset 3px 3px 0px 0px var(--gb-darkest),
        inset -2px -2px 0px 0px var(--gb-light);
    }

    .carved-block {
      background-color: var(--gb-light);
      box-shadow: 
        inset 2px 2px 0px 0px var(--gb-lightest),
        inset -2px -2px 0px 0px var(--gb-dark);
      border: 1px solid var(--gb-darkest);
    }

    .carved-block:active, .carved-block.active {
      box-shadow: 
        inset 2px 2px 0px 0px var(--gb-dark),
        inset -2px -2px 0px 0px var(--gb-lightest);
    }

    .excavated-tile {
      background-color: var(--gb-darkest) !important;
      box-shadow: inset 1px 1px 0px var(--gb-dark) !important;
    }

    /* D-pad and buttons styling */
    .dpad-btn {
      background-color: var(--gb-dark);
      box-shadow: 
        inset 2px 2px 0px var(--gb-light),
        inset -2px -2px 0px var(--gb-darkest),
        2px 2px 0px var(--gb-darkest);
    }

    .dpad-btn:active {
      box-shadow: 
        inset 2px 2px 0px var(--gb-darkest),
        inset -1px -1px 0px var(--gb-light);
      transform: translate(1px, 1px);
    }

    .retro-round-btn {
      background-color: var(--gb-dark);
      box-shadow: 
        inset 3px 3px 0px var(--gb-light),
        inset -3px -3px 0px var(--gb-darkest),
        3px 4px 0px var(--gb-darkest);
    }

    .retro-round-btn:active {
      box-shadow: 
        inset 3px 3px 0px var(--gb-darkest),
        inset -2px -2px 0px var(--gb-light);
      transform: translate(2px, 2px);
    }

    /* Blinking reticle cursor */
    @keyframes cursor-pulse {
      0%, 100% { opacity: 1; outline-color: var(--gb-darkest); }
      50% { opacity: 0.3; outline-color: transparent; }
    }

    .reticle-cursor {
      position: relative;
      outline: 2px dashed var(--gb-darkest);
      outline-offset: -1px;
      animation: cursor-pulse 0.75s infinite steps(2, start);
      z-index: 10;
    }

    /* Striped clue headers */
    .stripe-odd { background-color: var(--gb-light); }
    .stripe-even { background-color: var(--gb-lightest); }
  </style>
<!-- END: Custom Game Boy Theme Styles -->

<script data-purpose="cursor-and-audio-interaction">
    // Grid interactivity for mobile taps & controls
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('picross-grid');
      const cells = grid.querySelectorAll('div');
      let currentIndex = 74; // Current focus cell (Row 8, Col 5)

      function updateCursor(newIndex) {
        if (newIndex >= 0 && newIndex < cells.length) {
          cells[currentIndex].classList.remove('reticle-cursor');
          currentIndex = newIndex;
          cells[currentIndex].classList.add('reticle-cursor');
        }
      }

      // Allow direct mobile touch on any grid tile
      cells.forEach((cell, index) => {
        cell.addEventListener('pointerdown', () => {
          updateCursor(index);
          // If already dark, turn to stone, else excavate
          if (cell.classList.contains('excavated-tile')) {
            cell.classList.remove('excavated-tile');
            cell.innerText = '✕';
          } else if (cell.innerText === '✕') {
            cell.innerText = '';
          } else {
            cell.classList.add('excavated-tile');
          }
        });
      });

      // Directional Pad Navigation
      document.getElementById('btn-up').addEventListener('click', () => updateCursor(currentIndex - 10));
      document.getElementById('btn-down').addEventListener('click', () => updateCursor(currentIndex + 10));
      document.getElementById('btn-left').addEventListener('click', () => {
        if (currentIndex % 10 !== 0) updateCursor(currentIndex - 1);
      });
      document.getElementById('btn-right').addEventListener('click', () => {
        if (currentIndex % 10 !== 9) updateCursor(currentIndex + 1);
      });

      // Action A: Dig / Excavate
      document.getElementById('btn-action-a').addEventListener('click', () => {
        const cur = cells[currentIndex];
        cur.innerText = '';
        cur.classList.toggle('excavated-tile');
      });

      // Action B: Mark with X
      document.getElementById('btn-action-b').addEventListener('click', () => {
        const cur = cells[currentIndex];
        cur.classList.remove('excavated-tile');
        cur.innerText = cur.innerText === '✕' ? '' : '✕';
      });

      // Simple running timer simulation
      let totalSeconds = 1800; // 30 mins
      const timerElement = document.getElementById('picross-timer');
      setInterval(() => {
        if (totalSeconds > 0) {
          totalSeconds--;
          const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
          const s = String(totalSeconds % 60).padStart(2, '0');
          timerElement.innerText = `${m}:${s}`;
        }
      }, 1000);
    });
  </script>
<!-- END: Game Interactive Scripts -->
